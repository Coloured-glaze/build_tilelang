name: Build Wheels Only

on:
  workflow_dispatch:
    inputs:
      cuda_version:
        description: 'CUDA version (e.g. 12.1 | 12.8)'
        default: '12.8'
        required: true
        type: string
      os_version:
        description: 'OS version: ubuntu-latest, ubuntu-24.04, ubuntu-22.04, ubuntu-24.04-arm'
        default: 'ubuntu-22.04'
        required: true
        type: string
      repository:
        description: 'Optional: Repository to checkout (e.g. tile-ai/tilelang). Uses current repo if not provided.'
        required: false
        type: string
        default: 'tile-ai/tilelang'

permissions:
  contents: write

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  PYTHONDEVMODE: "1"
  PYTHONUNBUFFERED: "1"
  COLUMNS: "100"
  FORCE_COLOR: "1"
  CLICOLOR_FORCE: "1"

jobs:
  build-wheels:
    name: Build wheels for Python ${{ matrix.python-version }} on ${{ matrix.target.runner }} with ${{ matrix.target.toolkit }}
    strategy:
      matrix:
        target:
          - { runner: "${{ inputs.os_version }}", toolkit: "CUDA-${{ inputs.cuda_version }}" }
        python-version:
          # Wheels are built with Python 3.8 Limited API, they should work with all Python >= 3.8.
          # Only build wheels against Python 3.8 Limited API to save CI resources.
          # FIXME: Here we use Python 3.9 because our dependency `apache-tvm-ffi` claims to support
          #        Python 3.8 but it depends on a version of `ml-dtypes` that requires Python >= 3.9.
          - "3.9"
      fail-fast: false
    timeout-minutes: 120
    runs-on: ${{ matrix.target.runner }}
    env:
      NO_VERSION_LABEL: ${{ github.event_name == 'release' && 'OFF' || 'ON' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.repository }}
          fetch-depth: 1
          submodules: recursive
          path: tilelang-source

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          create-symlink: true
          evict-old-files: "7d"
          append-timestamp: false
          key: wheel-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target.toolkit }}-${{ hashFiles('tilelang-source/**/*.cc') }}
          restore-keys: |
            wheel-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target.toolkit }}-${{ hashFiles('tilelang-source/**/*.cc') }}
            wheel-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target.toolkit }}
            wheel-${{ runner.os }}-${{ runner.arch }}
            ${{ runner.os }}-${{ runner.arch }}-${{ matrix.target.toolkit }}
            ${{ runner.os }}-${{ runner.arch }}

      - name: Set pyproject
        shell: python
        run: |
          import re
          import os
          with open('tilelang-source/pyproject.toml', 'r') as f:
            content = f.read()
          
          # Replace rhel7 with rhel8
          modified_content = content.replace('rhel7/x86_64/cuda-rhel7.repo', 'rhel8/x86_64/cuda-rhel8.repo')
          # Replace nvidia.cn with nvidia.com
          modified_content = modified_content.replace('developer.download.nvidia.cn', 'developer.download.nvidia.com')
          
          # Find and replace the entire before-all section
          before_all_pattern = r'before-all = """\n(.*?)\n"""'
          match = re.search(before_all_pattern, modified_content, re.DOTALL)
          if match:
            original_before_all = match.group(1)
            print("Original before-all section:")
            print(original_before_all)
            
            # Replace yum install command with skip-broken and remove nvidia-driver-cuda-libs
            new_before_all = original_before_all.replace(
              'yum install -y "cuda-minimal-build-${v}" "cuda-driver-devel-${v}" "cuda-nvrtc-devel-${v}"',
              'yum install -y --skip-broken "cuda-minimal-build-${v}" "cuda-driver-devel-${v}" "cuda-nvrtc-devel-${v}" || true'
            )
            
            # Also handle case where nvidia-driver-cuda-libs is included
            new_before_all = new_before_all.replace(
              'yum install -y "cuda-minimal-build-${v}" "cuda-driver-devel-${v}" "cuda-nvrtc-devel-${v}" nvidia-driver-cuda-libs',
              'yum install -y --skip-broken "cuda-minimal-build-${v}" "cuda-driver-devel-${v}" "cuda-nvrtc-devel-${v}" || true'
            )
            
            print("Modified before-all section:")
            print(new_before_all)
            
            # Replace the entire before-all section
            modified_content = modified_content.replace(
              f'before-all = """\n{original_before_all}\n"""',
              f'before-all = """\n{new_before_all}\n"""'
            )
          
          with open('tilelang-source/pyproject.toml', 'w') as f:
            f.write(modified_content)

      - name: Print pyproject
        run: |
          echo "====================================================="
          echo "Contents of pyproject.toml after replacement:"
          cat tilelang-source/pyproject.toml
          echo "====================================================="

      - name: Set CIBW_BUILD
        run: |
          PYTHON_VERSION="${{ matrix.python-version }}"
          PYTHON_VERSION_MAJMIN="$(echo "${PYTHON_VERSION}" | cut -d '.' -f-2)"
          PYTHON_VERSION_MAJMIN_NODOT="${PYTHON_VERSION_MAJMIN//./}"
          echo "CIBW_BUILD=cp${PYTHON_VERSION_MAJMIN_NODOT}-*" | tee -a "${GITHUB_ENV}"
          if [[ "${{ matrix.target.toolkit }}" == *"CUDA"* ]]; then
            CUDA_VERSION="${{ matrix.target.toolkit }}"
            CUDA_VERSION="${CUDA_VERSION#CUDA-}"
            echo "CUDA_VERSION=${CUDA_VERSION}" | tee -a "${GITHUB_ENV}"
            # Add environment variables to handle CUDA installation issues
            echo "CIBW_ENVIRONMENT_LINUX=CUDA_VERSION=${CUDA_VERSION} CUDACXX=/usr/local/cuda/bin/nvcc LD_LIBRARY_PATH=/usr/local/cuda/lib64:$LD_LIBRARY_PATH SKIP_NVIDIA_DRIVER_LIBS=1" | tee -a "${GITHUB_ENV}"
          fi
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            HOST_CCACHE_DIR="$(ccache --get-config cache_dir)"
            # Build the complete CIBW_BEFORE_BUILD_LINUX command in one go to avoid syntax errors
            echo "CIBW_BEFORE_BUILD_LINUX=yum install -y ccache && ccache -o cache_dir=/host${HOST_CCACHE_DIR} && export CUDACXX=/usr/local/cuda/bin/nvcc && echo 'Skipping nvidia-driver-cuda-libs installation to avoid GLIBC conflicts'" | tee -a "${GITHUB_ENV}"
          fi
          # Set working directory for cibuildwheel
          echo "CIBW_BUILD_FRONTEND=build" | tee -a "${GITHUB_ENV}"

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.3
        with:
          package-dir: tilelang-source
          output-dir: wheelhouse
          config-file: "tilelang-source/pyproject.toml"

      - name: Upload wheels
        uses: actions/upload-artifact@v5
        with:
          name: wheels-${{ matrix.python-version }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target.toolkit }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  list-wheels:
    name: List wheel artifacts
    runs-on: ubuntu-latest
    needs: [build-wheels]
    timeout-minutes: 15
    steps:
      - name: Download built wheels
        uses: actions/download-artifact@v6
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: List wheel distributions
        run: ls -lh dist/*.whl

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v5
        with:
          name: wheel-artifacts
          path: dist/*.whl
          if-no-files-found: error