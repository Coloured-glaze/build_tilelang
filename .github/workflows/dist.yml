name: Dist
on:
  workflow_dispatch:
    inputs:
      version:
        description: '自定义版本：若为 commit、tag、version 则自动获取'
        default: 'commit'
        required: true
        type: string
      python_version:
        description: 'Python version (支持多值，用分号分隔)'
        default: '3.10'
        required: true
        type: string
      torch_version:
        description: 'PyTorch version (支持多值，用分号分隔)'
        default: '2.8'
        required: true
        type: string
      cuda_version:
        description: 'CUDA version (支持多值，用分号分隔)'
        default: '12.8.1'
        required: true
        type: string
      os_version:
        description: 'OS version: ubuntu-latest, ubuntu-24.04, ubuntu-22.04, ubuntu-24.04-arm'
        default: 'ubuntu-22.04'
        required: true
        type: string
      upload_artifact:
        description: 'Upload artifact: 0 or 1'
        required: true
        type: choice
        options:
          - '1'
          - '0'
        default: '1'
      release:
        description: 'Create release: 0 or 1'
        required: true
        type: choice
        options:
          - '1'
          - '0'
        default: '0'
      repository:
        description: 'Optional: Repository to checkout (e.g. tile-ai/tilelang). Uses current repo if not provided.'
        required: false
        type: string
        default: 'tile-ai/tilelang'

permissions:
  contents: write

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  set_matrix:
    name: Generate Build Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set Matrix
        id: set-matrix
        run: |
          import os
          import json

          py_versions = os.getenv("PYTHON_VERSION", "").split(";")
          torch_versions = os.getenv("TORCH_VERSION", "").split(";")
          cuda_versions = os.getenv("CUDA_VERSION", "").split(";")
          os_versions = os.getenv("OS_VERSION", "").split(";")

          include = []
          for os_ver in os_versions:
            for py in py_versions:
              for cu in cuda_versions:
                for th in torch_versions:
                  include.append({
                    "os_version": os_ver.strip(),
                    "python_ver": py.strip(),
                    "cuda_ver": cu.strip(),
                    "torch": th.strip()
                  })

          matrix = { "include": include }
          with open(os.getenv('GITHUB_OUTPUT'), 'a') as f:
            f.write(f"matrix={json.dumps(matrix)}\n")

          print("Generated matrix:", matrix)
        shell: python
        env:
          PYTHON_VERSION: ${{ inputs.python_version }}
          TORCH_VERSION: ${{ inputs.torch_version }}
          CUDA_VERSION: ${{ inputs.cuda_version }}
          OS_VERSION: ${{ inputs.os_version }}

  build-wheels:
    name: ${{ matrix.os_version }}-py${{ matrix.python_ver }}-cu${{ matrix.cuda_ver }}
    needs: set_matrix
    strategy:
      matrix: ${{ fromJSON(needs.set_matrix.outputs.matrix) }}
      fail-fast: false
    timeout-minutes: 120
    runs-on: ${{ matrix.os_version }}
    env:
      NO_VERSION_LABEL: ${{ github.event_name == 'release' && 'OFF' || 'ON' }}
    outputs:
      d_ver: ${{ steps.determine_version.outputs.d_ver }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.3.0
        with:
          fetch-depth: 1
          submodules: recursive
          repository: ${{ inputs.repository }}

      - name: Determine Version
        id: determine_version
        run: |
          INPUT_VERSION="${{ inputs.version }}"
          case "$INPUT_VERSION" in
            commit)
              version="$(git rev-parse --short HEAD)"
              ;;
            tag)
              version="git-$(git describe --tags --abbrev=0)"
              ;;
            version)
              if [ -f VERSION ]; then
                version=$(cat VERSION)
              else
                version="$INPUT_VERSION"
              fi
              ;;
            *)
              version="$INPUT_VERSION"
              ;;
          esac
          echo "d_ver=$version" >> "$GITHUB_OUTPUT"

      - name: Free Disk Space (Linux only)
        if: runner.os == 'Linux'
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          echo "Free disk space after removing large packages:"
          df -h

      - name: Get PATH Folder Sizes with Python
        run: |
          python -c "
          import os
          import subprocess
          
          # 获取 PATH 环境变量
          path_dirs = os.environ.get('PATH', '').split(':')
          
          print('PATH directories and their sizes:')
          print(path_dirs)
          print('=' * 60)
          
          total_size = 0
          for path_dir in path_dirs:
              if os.path.exists(path_dir) and os.path.isdir(path_dir):
                  try:
                      # 使用 du 命令获取文件夹大小
                      result = subprocess.run(['du', '-sh', path_dir], capture_output=True, text=True)
                      if result.returncode == 0:
                          size_info = result.stdout.strip().split('\t')[0]
                          print(f'{size_info:>8}  {path_dir}')
                          
                          # 解析大小（转换为字节用于总计）
                          if 'G' in size_info:
                              size_bytes = float(size_info.replace('G', '')) * 1024 * 1024 * 1024
                          elif 'M' in size_info:
                              size_bytes = float(size_info.replace('M', '')) * 1024 * 1024
                          elif 'K' in size_info:
                              size_bytes = float(size_info.replace('K', '')) * 1024
                          else:
                              size_bytes = float(size_info)
                          total_size += size_bytes
                      else:
                          print(f'Error getting size for: {path_dir}')
                  except Exception as e:
                      print(f'Error processing {path_dir}: {e}')
              else:
                  print(f'Missing or not a directory: {path_dir}')
          
          # 显示总计大小
          print('=' * 60)
          if total_size >= 1024 * 1024 * 1024:
              total_gb = total_size / (1024 * 1024 * 1024)
              print(f'Total PATH size: {total_gb:.2f} GB')
          elif total_size >= 1024 * 1024:
              total_mb = total_size / (1024 * 1024)
              print(f'Total PATH size: {total_mb:.2f} MB')
          elif total_size >= 1024:
              total_kb = total_size / 1024
              print(f'Total PATH size: {total_kb:.2f} KB')
          else:
              print(f'Total PATH size: {total_size:.0f} bytes')
          
          # 显示 PATH 中的目录数量
          valid_dirs = [d for d in path_dirs if os.path.exists(d) and os.path.isdir(d)]
          print(f'Number of valid PATH directories: {len(valid_dirs)}')
          print(f'Total PATH entries: {len(path_dirs)}')
          "
      
      # NB: CIBW builds wheels in containers on Linux

      - name: Set CIBW_BUILD
        run: |
          PYTHON_VERSION="${{ matrix.python_ver }}"
          PYTHON_VERSION_MAJMIN="$(echo "${PYTHON_VERSION}" | cut -d '.' -f-2)"
          PYTHON_VERSION_MAJMIN_NODOT="${PYTHON_VERSION_MAJMIN//./}"
          echo "CIBW_BUILD=cp${PYTHON_VERSION_MAJMIN_NODOT}-*" | tee -a "${GITHUB_ENV}"
          echo "PYTHON_VERSION_MAJMIN_NODOT=${PYTHON_VERSION_MAJMIN_NODOT}" | tee -a "${GITHUB_ENV}"

          CUDA_VERSION="${{ matrix.cuda_ver }}"
          echo "CUDA_VERSION=${CUDA_VERSION}" | tee -a "${GITHUB_ENV}"
          
          # Set TORCH_CUDA_VERSION based on PyTorch version
          MATRIX_CUDA_VERSION=$(echo '${{ matrix.cuda_ver }}' | awk -F. '{print $1$2}')
          MATRIX_TORCH_VERSION=$(echo '${{ matrix.torch }}' | awk -F. '{print $1"."$2}')
          
          # 根据 PyTorch 版本选择 CUDA 构建版本
          TORCH_CUDA_VERSION=$(python -c "
          ver = '$MATRIX_TORCH_VERSION'
          cuda_ver = int('$MATRIX_CUDA_VERSION')
          mapping = {
              '2.1': '118' if cuda_ver < 120 else '121',
              '2.2': '121' if cuda_ver < 120 else '121',
              '2.3': '121' if cuda_ver < 120 else '121',
              '2.4': '124' if cuda_ver < 121 else '124',
              '2.5': '124' if cuda_ver < 121 else '124',
              '2.6': '126' if cuda_ver < 121 else '126',
              '2.7': '128' if cuda_ver < 124 else '128',
              '2.8': '128' if cuda_ver < 124 else '128',
              '2.9': '128' if cuda_ver < 126 else '128',
          }
          print(mapping.get(ver, '121'))  # 默认 fallback
          ")
          
          echo "TORCH_CUDA_VERSION=$TORCH_CUDA_VERSION" | tee -a "${GITHUB_ENV}"
          
          # Print build information
          echo "======== Build Information ========"
          echo "Build Tag: ${{ steps.determine_version.outputs.d_ver }}-py${{ matrix.python_ver }}-th${{ matrix.torch }}-cu${{ matrix.cuda_ver }}-${{ inputs.os_version }}"
          echo "Python Version: ${PYTHON_VERSION}"
          echo "Python Major.Minor: ${PYTHON_VERSION_MAJMIN}"
          echo "Python Major.Minor (no dot): ${PYTHON_VERSION_MAJMIN_NODOT}"
          echo "CUDA Version: ${CUDA_VERSION}"
          echo "Matrix CUDA Version: ${MATRIX_CUDA_VERSION}"
          echo "Torch Version: ${MATRIX_TORCH_VERSION}"
          echo "Torch CUDA Version: ${TORCH_CUDA_VERSION}"
          echo "=================================="
          
          free -m
          df -h

          python -c "
          import re
          import os
          
          with open('pyproject.toml', 'r') as f:
              content = f.read()

          modified_content = content.replace('rhel7/x86_64/cuda-rhel7.repo', 'rhel8/x86_64/cuda-rhel8.repo')
          
          modified_content = modified_content.replace('developer.download.nvidia.cn', 'developer.download.nvidia.com')
          
          with open('pyproject.toml', 'w') as f:
              f.write(modified_content)
          
          "
          echo "Contents of pyproject.toml after replacement:"
          cat pyproject.toml

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.2.0
        with:
          package-dir: .
          output-dir: wheelhouse
          config-file: "{package}/pyproject.toml"
        env:
          CIBW_DEBUG_TRACEBACK: 1
          CIBW_BUILD_VERBOSITY: 3
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
          CIBW_BUILD: "cp${{ env.PYTHON_VERSION_MAJMIN_NODOT }}-manylinux_x86_64"
          CIBW_SKIP: "cp${{ env.PYTHON_VERSION_MAJMIN_NODOT }}-win* cp${{ env.PYTHON_VERSION_MAJMIN_NODOT }}-musl* cp${{ env.PYTHON_VERSION_MAJMIN_NODOT }}-macosx*"
          CIBW_ENVIRONMENT_PASS_LINUX: "CUDA_VERSION TORCH_CUDA_VERSION"
          CIBW_ENVIRONMENT: "MAX_JOBS=2"
          CIBW_BUILD_FRONTEND: "pip"
          CIBW_BEFORE_ALL: |
            set -x
            df -h
            # Check CUDA version format (must be x.x.x)
            if ! echo "${CUDA_VERSION}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "Error: CUDA_VERSION must be in format x.x.x, got '${CUDA_VERSION}'"
              exit 1
            fi
            
            # Clear package manager cache
            dnf clean all
            
            # Install CUDA toolkit
            dnf config-manager --add-repo https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/cuda-rhel8.repo
            dnf clean all
            RETRIES=5
            COUNT=0
            # install specific version of cuda-toolkit (using major.minor format)
            CUDA_PKG_VERSION=$(echo "${CUDA_VERSION}" | cut -d. -f1,2 | sed 's/\./-/')
            until dnf -y install cuda-toolkit-${CUDA_PKG_VERSION}; do
              if [[ $COUNT -ge $RETRIES ]]; then
                echo "Failed after $RETRIES attempts, aborting."
                exit 1
              fi
              COUNT=$((COUNT+1))
              echo "Retrying CUDA installation($COUNT/$RETRIES)..."
              sleep 10
            done
            
            # Clean up downloaded packages to save disk space
            dnf clean packages
            
            ls -al /usr/local
            export PATH=$PATH:/usr/local/cuda/bin
            nvcc --version
            df -h
          CIBW_BEFORE_BUILD: |
            # Install PyTorch ${{ env.TORCH_CUDA_VERSION }}
            pip install --upgrade pip

            # With python 3.13 and torch 2.5.1, unless we update typing-extensions, we get error
            pip install typing-extensions==4.12.2
            
            pip install --no-cache-dir torch==${{ matrix.torch }} --index-url https://download.pytorch.org/whl/cu${TORCH_CUDA_VERSION}
            
            # Install build dependencies
            pip install 'numpy<2.0'
            pip install ninja packaging wheel setuptools==75.8.0 cmake==3.28 Cython build
            
            # Install project specific requirements
            pip install --no-cache-dir -r requirements-build.txt
            
            export PATH=/usr/local/cuda/bin:/usr/local/cuda/lib64:/usr/local/nvidia/bin:/usr/local/nvidia/lib64:$PATH
            export LD_LIBRARY_PATH=/usr/local/nvidia/lib64:/usr/local/cuda/lib64:$LD_LIBRARY_PATH
            nvcc --version
            python --version
            python -c "import torch; print('PyTorch:', torch.__version__)"
            python -c "import torch; print('CUDA:', torch.version.cuda)"
            python -c "from torch.utils import cpp_extension; print (cpp_extension.CUDA_HOME)"
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: |
            auditwheel repair --exclude 'libcuda.so*' --exclude 'libtorch.so*' --exclude 'libc10.so*' --exclude 'libtorch_python.so*' --exclude 'libc10_cuda.so*' --exclude 'libtorch_cuda.so*' --exclude 'libtorch_cpu.so*' --exclude 'libcudart.so.*' -w {dest_dir} {wheel}

      - name: Upload wheels
        if: ${{ inputs.upload_artifact == '1' }}
        uses: actions/upload-artifact@v4.4.0
        with:
          name: ${{ steps.determine_version.outputs.d_ver }}-py${{ matrix.python_ver }}-cu${{ matrix.cuda_ver }}-${{ matrix.os_version }}
          path: wheelhouse/*.whl
          if-no-files-found: error

      - name: Create Release
        if: ${{ inputs.release == '1' }}
        uses: softprops/action-gh-release@v2.3.3
        with:
          tag_name: ${{ steps.determine_version.outputs.d_ver }}-py${{ matrix.python_ver }}-cu${{ matrix.cuda_ver }}-${{ matrix.os_version }}
          files: wheelhouse/*.whl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  list-artifacts:
    name: List artifacts
    if: ${{ inputs.upload_artifact == '1' }}
    runs-on: ubuntu-latest
    needs: [set_matrix, build-wheels]
    timeout-minutes: 15
    steps:
      - name: Download built wheels
        uses: actions/download-artifact@v5
        with:
          pattern: ${{ needs.build-wheels.outputs.d_ver }}-*
          path: dist
          merge-multiple: true

      - name: List distributions
        run: ls -lh dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4.4.0
        with:
          name: artifacts
          path: dist/*
          if-no-files-found: error
