name: Dist
on:
  workflow_dispatch:
    inputs:
      version:
        description: '自定义版本：若为 commit、tag、version 则自动获取'
        default: 'commit'
        required: true
        type: string
      python_version:
        description: 'Python version (支持多值，用分号分隔)'
        default: '3.9'
        required: true
        type: string
      cuda_version:
        description: 'CUDA version (支持多值，用分号分隔)'
        default: '12.8'
        required: true
        type: string
      os_version:
        description: 'OS version: ubuntu-latest, ubuntu-24.04, ubuntu-22.04, ubuntu-24.04-arm'
        default: 'ubuntu-22.04'
        required: true
        type: string
      upload_artifact:
        description: 'Upload artifact: 0 or 1'
        required: true
        type: choice
        options:
          - '1'
          - '0'
        default: '1'
      release:
        description: 'Create release: 0 or 1'
        required: true
        type: choice
        options:
          - '1'
          - '0'
        default: '0'
      repository:
        description: 'Optional: Repository to checkout (e.g. tile-ai/tilelang). Uses current repo if not provided.'
        required: false
        type: string
        default: 'tile-ai/tilelang'

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  set_matrix:
    name: Generate Build Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set Matrix
        id: set-matrix
        run: |
          import os
          import json

          py_versions = os.getenv("PYTHON_VERSION", "").split(";")
          cuda_versions = os.getenv("CUDA_VERSION", "").split(";")
          os_versions = os.getenv("OS_VERSION", "").split(";")

          include = []
          for os_ver in os_versions:
            for py in py_versions:
              for cu in cuda_versions:
                include.append({
                  "os_version": os_ver.strip(),
                  "python_ver": py.strip(),
                  "cuda_ver": cu.strip()
                })

          matrix = { "include": include }
          with open(os.getenv('GITHUB_OUTPUT'), 'a') as f:
            f.write(f"matrix={json.dumps(matrix)}\n")

          print("Generated matrix:", matrix)
        shell: python
        env:
          PYTHON_VERSION: ${{ inputs.python_version }}
          CUDA_VERSION: ${{ inputs.cuda_version }}
          OS_VERSION: ${{ inputs.os_version }}

  build-wheels:
    name: ${{ matrix.os_version }}-py${{ matrix.python_ver }}-cu${{ matrix.cuda_ver }}
    needs: set_matrix
    strategy:
      matrix: ${{ fromJSON(needs.set_matrix.outputs.matrix) }}
      fail-fast: false
    timeout-minutes: 120
    runs-on: ${{ matrix.os_version }}
    env:
      NO_VERSION_LABEL: ${{ github.event_name == 'release' && 'OFF' || 'ON' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive
          repository: ${{ inputs.repository }}

      - name: Determine Version
        id: determine_version
        run: |
          INPUT_VERSION="${{ inputs.version }}"
          case "$INPUT_VERSION" in
            commit)
              version="$(git rev-parse --short HEAD)"
              ;;
            tag)
              version="git-$(git describe --tags --abbrev=0)"
              ;;
            version)
              if [ -f VERSION ]; then
                version=$(cat VERSION)
              else
                version="$INPUT_VERSION"
              fi
              ;;
            *)
              version="$INPUT_VERSION"
              ;;
          esac
          echo "d_ver=$version" >> "$GITHUB_OUTPUT"

      # NB: CIBW builds wheels in containers on Linux

      - name: Set CIBW_BUILD
        run: |
          PYTHON_VERSION="${{ matrix.python_ver }}"
          PYTHON_VERSION_MAJMIN="$(echo "${PYTHON_VERSION}" | cut -d '.' -f-2)"
          PYTHON_VERSION_MAJMIN_NODOT="${PYTHON_VERSION_MAJMIN//./}"
          echo "CIBW_BUILD=cp${PYTHON_VERSION_MAJMIN_NODOT}-*" | tee -a "${GITHUB_ENV}"
          echo "PYTHON_VERSION_MAJMIN_NODOT=${PYTHON_VERSION_MAJMIN_NODOT}" | tee -a "${GITHUB_ENV}"

          CUDA_VERSION="${{ matrix.cuda_ver }}"
          echo "CUDA_VERSION=${CUDA_VERSION}" | tee -a "${GITHUB_ENV}"

          # Remove CUDA installation code from pyproject.toml
          python -c "
          import re
          import os
          
          # Read the pyproject.toml file
          with open('pyproject.toml', 'r') as f:
              content = f.read()
          
          # Remove the before-all section that installs CUDA
          # This removes the multi-line string from line 150 to 168
          pattern = r'before-all = \"\"\".*?\"\"\"'
          modified_content = re.sub(pattern, 'before-all = \"\"\"\"\"\"', content, flags=re.DOTALL)
          
          # Write back to the file
          with open('pyproject.toml', 'w') as f:
              f.write(modified_content)
          
          print('Removed CUDA installation code from pyproject.toml')
          "
          echo "Contents of pyproject.toml after removal:"
          cat pyproject.toml

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.2
        with:
          package-dir: .
          output-dir: wheelhouse
          config-file: "{package}/pyproject.toml"
        env:
          CIBW_DEBUG_TRACEBACK: 1
          CIBW_BUILD_VERBOSITY: 3
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
          CIBW_BUILD: "cp${{ env.PYTHON_VERSION_MAJMIN_NODOT }}-manylinux_x86_64"
          CIBW_SKIP: "cp${{ env.PYTHON_VERSION_MAJMIN_NODOT }}-win* cp${{ env.PYTHON_VERSION_MAJMIN_NODOT }}-musl* cp${{ env.PYTHON_VERSION_MAJMIN_NODOT }}-macosx*"
          CIBW_ENVIRONMENT_PASS_LINUX: "CUDA_VERSION"
          CIBW_ENVIRONMENT: "MAX_JOBS=2"
          CIBW_BUILD_FRONTEND: "pip"
          CIBW_BEFORE_ALL: |
            set -x
            # Install CUDA toolkit
            dnf config-manager --add-repo https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/cuda-rhel8.repo
            dnf clean all
            RETRIES=5
            COUNT=0
            # install full cuda-toolkit
            until dnf -y install cuda-toolkit-${{ matrix.cuda_ver }}; do
              if [[ $COUNT -ge $RETRIES ]]; then
                echo "Failed after $RETRIES attempts, aborting."
                exit 1
              fi
              COUNT=$((COUNT+1))
              echo "Retrying CUDA installation($COUNT/$RETRIES)..."
              sleep 10
            done
            ls -al /usr/local
            export PATH=$PATH:/usr/local/cuda/bin
            nvcc --version
          CIBW_BEFORE_BUILD: |
            # Install build dependencies
            pip install --upgrade pip
            pip install ninja packaging wheel setuptools==75.8.0 cmake==3.28 Cython build
            
            export PATH=/usr/local/cuda/bin:/usr/local/cuda/lib64:/usr/local/nvidia/bin:/usr/local/nvidia/lib64:$PATH
            export LD_LIBRARY_PATH=/usr/local/nvidia/lib64:/usr/local/cuda/lib64:$LD_LIBRARY_PATH
            nvcc --version
            python --version

      - name: Upload wheels
        if: ${{ inputs.upload_artifact == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.determine_version.outputs.d_ver }}-py${{ matrix.python_ver }}-cu${{ matrix.cuda_ver }}-${{ matrix.os_version }}
          path: wheelhouse/*.whl
          if-no-files-found: error

      - name: Create Release
        if: ${{ inputs.release == '1' }}
        uses: softprops/action-gh-release@v2.3.3
        with:
          tag_name: ${{ steps.determine_version.outputs.d_ver }}-py${{ matrix.python_ver }}-cu${{ matrix.cuda_ver }}-${{ matrix.os_version }}
          files: wheelhouse/*.whl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  list-artifacts:
    name: List artifacts
    if: ${{ inputs.upload_artifact == '1' }}
    runs-on: ubuntu-latest
    needs: [build-wheels]
    timeout-minutes: 15
    steps:
      - name: Download built wheels
        uses: actions/download-artifact@v5
        with:
          pattern: ${{ steps.determine_version.outputs.d_ver }}-*
          path: dist
          merge-multiple: true

      - name: List distributions
        run: ls -lh dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: dist/*
          if-no-files-found: error
